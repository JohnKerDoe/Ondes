name: Mise à jour des podcasts

on:
  schedule:
    - cron: "17 */2 * * *"   # toutes les 2 heures, même sans ouvrir l'appli
  workflow_dispatch:          # lancé par l'appli à l'ouverture (ou bouton "Run workflow")
  push:
    paths:
      - feeds.txt             # relance dès que tu modifies la liste
      - scripts/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: podcasts-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les flux
        run: python3 scripts/update.py
      - name: Enregistrer episodes.json
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add episodes.json descriptions.json feeds-resolved.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour des épisodes"
          git pull --rebase
          git push
